[package]
name = "sticknodes-rs"
version = "4.0.0-alpha"
description = "Stick Nodes asset manipulation library. Currently only supports Stickfigures. Currently only supports assets up to version 4.2.3 build 72."
keywords = ["stick", "nodes", "asset", "read", "write"]
categories = ["parser-implementations"]
repository = "https://github.com/vinceTheProgrammer/sticknodes-rs"
license = "MIT"
edition = "2021"

[badges]
maintenance = { status = "passively-maintained" }

[features]
default = []
tryreadanyway = []

[dependencies]
byteorder = "1.5"
hashbrown = { version = "0.15.2", features = ["serde"] }
miniz_oxide = { version = "0.8.8", features = ["with-alloc"] }
petgraph = { version = "0.8.1", features = ["serde-1"] }
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
glam = "0.32.0"

[lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
missing_docs = "allow" # once docs issue is completed, this should be set to deny

# once an issue is completed, it should be set to deny
[lints.clippy]
# pedantic = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "warn"
similar_names = "warn"
too_many_lines = "warn"
struct_excessive_bools = "warn"